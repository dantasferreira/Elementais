<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreador de Elementais - Fortnite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-gaming { font-family: 'Chakra Petch', sans-serif; }
    
    /* Cores das variações */
    .badge-normal { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-dourado { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
    .badge-trapaca { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.4); }
    .badge-mitico { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

    /* Efeito de Domínio (Coroa) */
    .card-crowned {
      border-color: rgba(245, 158, 11, 0.8) !important;
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.5), rgba(120, 53, 15, 0.25)) !important;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.25);
    }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAruvFG2YHwaEesq-izCzDBfNvmX9F-uC0",
      authDomain: "elementais-2f4f4.firebaseapp.com",
      databaseURL: "https://elementais-2f4f4-default-rtdb.firebaseio.com",
      projectId: "elementais-2f4f4",
      storageBucket: "elementais-2f4f4.firebasestorage.app",
      messagingSenderId: "260143831871",
      appId: "1:260143831871:web:e507a21261f6e55ae1918a",
      measurementId: "G-2BJ6QHVHGT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const itemsRef = ref(db, 'elementais_status');

    // 16 Elementais base com descrições
    const baseElementais = [
      { nome: "Elemental Aventura", desc: "Melhora aleatoriamente a raridade de um item do inventário a cada nível ganho." },
      { nome: "Elemental Guarda da Moita", desc: "Cria um arbusto ao seu redor periodicamente; gera uma moita ao ser eliminado no nível máximo." },
      { nome: "Elemental Jonesy", desc: "Restaura parte de sua vida ou escudo logo após você receber dano de oponentes." },
      { nome: "Elemental Sonic", desc: "Concede bônus de velocidade e aceleração ao jogador." },
      { nome: "Elemental Tails", desc: "Permite planar e ganhar mobilidade vertical avançada." },
      { nome: "Elemental Klimbo", desc: "Pequena criatura baseada no clássico dinossauro do jogo." },
      { nome: "Elemental Jackrabbit", desc: "Focado em agilidade e saltos." },
      { nome: "Elemental 8-Bits", desc: "Estética retrô pixelada." },
      { nome: "Elemental Shadow", desc: "Concede camuflagem e bônus de movimentação furtiva." },
      { nome: "Elemental Coroa (Crown)", desc: "Relacionado a bônus de vitórias consecutivas." },
      { nome: "Elemental Disruptor", desc: "Interfere com aparelhos e radares inimigos." },
      { nome: "Elemental Raio X", desc: "Marca inimigos periodicamente em uma área ao seu redor (o raio e a frequência aumentam a cada nível)." },
      { nome: "Elemental Onigiri", desc: "Aplica o efeito Sobrecarga após consumir qualquer item de cura ou escudo." },
      { nome: "Elemental Mega Man", desc: "Reduz o atrito ao deslizar, permitindo que você deslize muito mais longe." },
      { nome: "Elemental Sobreescudo", desc: "Concede e regenera uma camada extra de Sobrescudo para o jogador." },
      /*{ nome: "Elemental Cavaleiro (Knight)", desc: "Nova criatura focada em defesa adicionada ao ecossistema." },*/
      { nome: "Elemental Storm Scout", desc: "Nova criatura da tempestade." }
    ];

    const tipos = [
      { tipo: "Normal", badgeClass: "badge-normal" },
      { tipo: "Dourado", badgeClass: "badge-dourado" },
      { tipo: "Trapaça", badgeClass: "badge-trapaca" },
      { tipo: "Mítico", badgeClass: "badge-mitico" }
    ];

    // Montagem dos 64 itens sequenciais
    const elementaisData = [];
    let counter = 1;

    baseElementais.forEach((el) => {
      tipos.forEach((t) => {
        elementaisData.push({
          id: counter,
          nome: el.nome,
          descricao: el.desc,
          versao: t.tipo,
          badgeClass: t.badgeClass,
          img: "" 
        });
        counter++;
      });
    });

    // Mapeamento de Imagens
    elementaisData[0].img = "img/Elemental-Aventura-Normal.jpeg";
    elementaisData[1].img = "img/Elemental-Aventura-Dourado.jpeg";
    elementaisData[2].img = "img/Elemental-Aventura-Trapaça.jpeg";
    elementaisData[3].img = "img/Elemental-Aventura-Mítico.jpeg";
    elementaisData[4].img = "img/Elemental-Moita-Normal.jpeg";
    elementaisData[5].img = "img/Elemental-Moita-Dourado.jpeg";
    elementaisData[6].img = "img/Elemental-Moita-Trapaça.jpeg";
    elementaisData[7].img = "img/Elemental-Moita-Mítico.jpeg";
    elementaisData[8].img = "img/Elemental-Jonesy-Normal.jpeg";
    elementaisData[9].img = "img/Elemental-Jonesy-Dourado.jpeg";
    elementaisData[10].img = "img/Elemental-Jonesy-Trapaça.jpeg";
    elementaisData[11].img = "img/Elemental-Jonesy-Mítico.jpeg";
    elementaisData[12].img = "img/Elemental-Sonic-Normal.jpeg";
    elementaisData[13].img = "img/Elemental-Sonic-Dourado.jpeg";
    elementaisData[14].img = "img/Elemental-Sonic-Trapaça.jpeg";
    elementaisData[15].img = "img/Elemental-Sonic-Mítico.jpeg";
    elementaisData[16].img = "img/Elemental-Tails-Normal.jpeg";
    elementaisData[17].img = "img/Elemental-Tails-Dourado.jpeg";
    elementaisData[18].img = "img/Elemental-Tails-Trapaça.jpeg";
    elementaisData[19].img = "img/Elemental-Tails-Mítico.jpeg";
    elementaisData[20].img = "img/Elemental-Klimbo-Normal.jpeg";
    elementaisData[21].img = "img/Elemental-Klimbo-Dourado.jpeg";
    elementaisData[22].img = "img/Elemental-Klimbo-Trapaça.jpeg";
    elementaisData[23].img = "img/Elemental-Klimbo-Mítico.jpeg";
    elementaisData[24].img = "img/Elemental-Jackrabbit-Normal.jpeg";
    elementaisData[25].img = "img/Elemental-Jackrabbit-Dourado.jpeg";
    elementaisData[26].img = "img/Elemental-Jackrabbit-Trapaça.jpeg";
    elementaisData[27].img = "img/Elemental-Jackrabbit-Mítico.jpeg";
    elementaisData[28].img = "img/Elemental-8-Bits-Normal.jpeg";
    elementaisData[29].img = "img/Elemental-8-Bits-Dourado.jpeg";
    elementaisData[30].img = "img/Elemental-8-Bits-Trapaça.jpeg";
    elementaisData[31].img = "img/Elemental-8-Bits-Mítico.jpeg";
    elementaisData[32].img = "img/Elemental-Shadow-Normal.jpeg";
    elementaisData[33].img = "img/Elemental-Shadow-Dourado.jpeg";
    elementaisData[34].img = "img/Elemental-Shadow-Trapaça.jpeg";
    elementaisData[35].img = "img/Elemental-Shadow-Mítico.jpeg";
    elementaisData[36].img = "img/Elemental-Coroa-Normal.jpeg";
    elementaisData[37].img = "img/Elemental-Coroa-Dourado.jpeg";
    elementaisData[38].img = "img/Elemental-Coroa-Trapaça.jpeg";
    elementaisData[39].img = "img/Elemental-Coroa-Mítico.jpeg";
    elementaisData[40].img = "img/Elemental-Disruptor-Normal.jpeg";
    elementaisData[41].img = "img/Elemental-Disruptor-Dourado.jpeg";
    elementaisData[42].img = "img/Elemental-Disruptor-Trapaça.jpeg";
    elementaisData[43].img = "img/Elemental-Disruptor-Mítico.jpeg";
    elementaisData[44].img = "img/Elemental-Raio-X-Normal.jpeg";
    elementaisData[45].img = "img/Elemental-Raio-X-Dourado.jpeg";
    elementaisData[46].img = "img/Elemental-Raio-X-Trapaça.jpeg";
    elementaisData[47].img = "img/Elemental-Raio-X-Mítico.jpeg";
    elementaisData[48].img = "img/Elemental-Onigiri-Normal.jpeg";
    elementaisData[49].img = "img/Elemental-Onigiri-Dourado.jpeg";
    elementaisData[50].img = "img/Elemental-Onigiri-Trapaça.jpeg";
    elementaisData[51].img = "img/Elemental-Onigiri-Mítico.jpeg";
    elementaisData[52].img = "img/Elemental-Mega-Man-Normal.jpeg";
    elementaisData[56].img = "img/Elemental-Sobreescudo-Normal.jpeg";
    elementaisData[57].img = "img/Elemental-Sobreescudo-Dourado.jpeg";
    elementaisData[58].img = "img/Elemental-Sobreescudo-Trapaça.jpeg";
    elementaisData[59].img = "img/Elemental-Sobreescudo-Mítico.jpeg";
    elementaisData[64].img = "img/Elemental-Storm-Scout-Normal.jpeg";
    elementaisData[65].img = "img/Elemental-Storm-Scout-Dourado.jpeg";
    elementaisData[66].img = "img/Elemental-Storm-Scout-Trapaça.jpeg";
    elementaisData[67].img = "img/Elemental-Storm-Scout-Mítico.jpeg";

    // Variáveis de controle de filtro
    let currentFilter = 'all'; // 'all', 'checked', 'crowned', 'missing'
    let searchTerm = '';
    let currentState = {};

    const grid = document.getElementById('grid');

    // Renderiza a interface inicial
    elementaisData.forEach(item => {
      const card = document.createElement('div');
      card.id = `card-${item.id}`;
      card.className = "relative flex flex-col justify-between p-3 rounded-xl border border-slate-800 bg-slate-900/90 hover:border-slate-600 transition-all select-none group";

      const isValidImg = item.img && item.img.trim() !== "" && item.img !== "#";
      const imgPlaceholder = `
        <div class="w-full h-24 bg-slate-950/70 border border-slate-800 rounded-lg flex flex-col items-center justify-center text-slate-500 mb-2 overflow-hidden group-hover:border-slate-700">
          <span class="text-2xl mb-1">👾</span>
          <span class="text-[10px] uppercase font-mono tracking-wider">Sem Imagem</span>
        </div>
      `;

      const imgElement = isValidImg 
        ? `<img src="${item.img}" alt="${item.nome} ${item.versao}" class="w-full h-24 object-contain rounded-lg mb-2 p-1 bg-slate-950 border border-slate-800">`
        : imgPlaceholder;

      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-mono font-bold text-slate-400">#${item.id}</span>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full uppercase tracking-wider ${item.badgeClass}">${item.versao}</span>
          </div>
          
          <div class="relative">
            <!-- Selo de Coroa Flutuante sobre a imagem -->
            <div id="crown-badge-${item.id}" class="hidden absolute top-1 right-1 bg-amber-500/90 text-black px-1.5 py-0.5 rounded-md text-[10px] font-bold shadow-lg flex items-center gap-0.5 z-10">
              👑 DOMINADO
            </div>
            ${imgElement}
          </div>

          <h2 class="text-xs font-semibold text-slate-100 line-clamp-1 group-hover:text-white" title="${item.nome}">${item.nome}</h2>
        </div>

        <div class="mt-3 flex items-center justify-between gap-1 pt-2 border-t border-slate-800/80">
          <!-- Info de Habilidade -->
          <button type="button" onclick="showModal(${item.id})" class="text-slate-400 hover:text-cyan-400 p-1 rounded-md text-xs flex items-center gap-1 transition-colors" title="Ver Habilidade">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-width="2" d="M12 16v-4m0-4h.01"/></svg>
            <span class="text-[10px] hidden sm:inline">Info</span>
          </button>

          <div class="flex items-center gap-1.5">
            <!-- Botão de Coroa (Dominar) -->
            <button 
              type="button" 
              id="crown-btn-${item.id}" 
              onclick="toggleCrown(${item.id})" 
              title="Marcar como Dominado com Coroa"
              class="w-7 h-7 rounded-md border border-slate-700 bg-slate-950 flex items-center justify-center text-xs text-slate-500 hover:text-amber-400 hover:border-amber-500/50 transition-all"
            >
              👑
            </button>

            <!-- Checkbox de Captura -->
            <button 
              type="button" 
              id="check-${item.id}" 
              onclick="toggleItem(${item.id})" 
              title="Marcar como Obtido/Capturado"
              class="w-7 h-7 rounded-md border-2 border-slate-600 bg-slate-950 flex items-center justify-center text-transparent font-bold text-xs transition-all hover:border-emerald-500"
            >
              ✓
            </button>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });

    // Utilitário para verificar status
    function getItemStatus(id) {
      const val = currentState[id];
      if (typeof val === 'boolean') {
        return { captured: val, crowned: false };
      }
      return {
        captured: Boolean(val?.captured),
        crowned: Boolean(val?.crowned)
      };
    }

    // Aplica os filtros de visibilidade
    function applyFilters() {
      let visibleCount = 0;

      elementaisData.forEach(item => {
        const cardEl = document.getElementById(`card-${item.id}`);
        const status = getItemStatus(item.id);

        let matchesFilter = true;
        if (currentFilter === 'checked') matchesFilter = status.captured;
        if (currentFilter === 'crowned') matchesFilter = status.crowned;
        if (currentFilter === 'missing') matchesFilter = !status.captured;

        const matchesSearch = searchTerm === '' || 
          item.nome.toLowerCase().includes(searchTerm) || 
          item.versao.toLowerCase().includes(searchTerm) || 
          item.id.toString() === searchTerm;

        if (matchesFilter && matchesSearch) {
          cardEl.classList.remove('hidden');
          visibleCount++;
        } else {
          cardEl.classList.add('hidden');
        }
      });

      const emptyMsg = document.getElementById('empty-msg');
      if (visibleCount === 0) {
        emptyMsg.classList.remove('hidden');
      } else {
        emptyMsg.classList.add('hidden');
      }
    }

    // Atualização em tempo real via Firebase
    onValue(itemsRef, (snapshot) => {
      currentState = snapshot.val() || {};
      let totalChecked = 0;
      let totalCrowned = 0;

      elementaisData.forEach(item => {
        const checkEl = document.getElementById(`check-${item.id}`);
        const crownBtn = document.getElementById(`crown-btn-${item.id}`);
        const crownBadge = document.getElementById(`crown-badge-${item.id}`);
        const cardEl = document.getElementById(`card-${item.id}`);
        const status = getItemStatus(item.id);

        if (status.captured) totalChecked++;
        if (status.crowned) totalCrowned++;

        // Render Checkbox de Captura
        if (status.captured) {
          checkEl.className = "w-7 h-7 rounded-md bg-emerald-500 border-2 border-emerald-400 flex items-center justify-center text-slate-950 font-bold text-xs shadow-[0_0_10px_rgba(16,185,129,0.3)]";
          checkEl.textContent = "✓";
          cardEl.classList.add("bg-emerald-950/20", "border-emerald-500/50");
        } else {
          checkEl.className = "w-7 h-7 rounded-md border-2 border-slate-700 bg-slate-950 flex items-center justify-center text-transparent text-xs hover:border-emerald-500";
          checkEl.textContent = "✓";
          cardEl.classList.remove("bg-emerald-950/20", "border-emerald-500/50");
        }

        // Render Efeito de Coroa (Dominado)
        if (status.crowned) {
          crownBtn.className = "w-7 h-7 rounded-md bg-amber-500 border border-amber-400 flex items-center justify-center text-xs text-black font-bold shadow-[0_0_10px_rgba(245,158,11,0.5)]";
          crownBadge.classList.remove("hidden");
          cardEl.classList.add("card-crowned");
        } else {
          crownBtn.className = "w-7 h-7 rounded-md border border-slate-700 bg-slate-950 flex items-center justify-center text-xs text-slate-500 hover:text-amber-400 hover:border-amber-500/50 transition-all";
          crownBadge.classList.add("hidden");
          cardEl.classList.remove("card-crowned");
        }
      });

      const total = elementaisData.length;
      const totalMissing = total - totalChecked;

      // Atualiza contadores
      document.getElementById('counter').innerText = `${totalChecked} / ${total}`;
      document.getElementById('crowned-counter').innerText = `${totalCrowned} Dominados`;
      document.getElementById('count-all').innerText = total;
      document.getElementById('count-checked').innerText = totalChecked;
      document.getElementById('count-crowned').innerText = totalCrowned;
      document.getElementById('count-missing').innerText = totalMissing;

      const pct = Math.round((totalChecked / total) * 100);
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-pct').innerText = `${pct}%`;

      applyFilters();
    });

    // Funções de Controle no Firebase
    window.toggleItem = (id) => {
      const status = getItemStatus(id);
      const newCaptured = !status.captured;
      // Se desmarcar como capturado, retira a coroa automaticamente
      const newCrowned = newCaptured ? status.crowned : false;
      
      set(ref(db, `elementais_status/${id}`), {
        captured: newCaptured,
        crowned: newCrowned
      });
    };

    window.toggleCrown = (id) => {
      const status = getItemStatus(id);
      const newCrowned = !status.crowned;
      // Se ativar coroa, marca automaticamente como capturado
      const newCaptured = newCrowned ? true : status.captured;

      set(ref(db, `elementais_status/${id}`), {
        captured: newCaptured,
        crowned: newCrowned
      });
    };

    window.setFilter = (filterType) => {
      currentFilter = filterType;
      
      const buttons = {
        'all': document.getElementById('btn-all'),
        'checked': document.getElementById('btn-checked'),
        'crowned': document.getElementById('btn-crowned'),
        'missing': document.getElementById('btn-missing')
      };

      Object.keys(buttons).forEach(type => {
        if (type === filterType) {
          if (type === 'crowned') {
            buttons[type].className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-500 text-slate-950 shadow-md flex items-center gap-1.5 transition-all";
          } else {
            buttons[type].className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500 text-slate-950 shadow-md flex items-center gap-1.5 transition-all";
          }
        } else {
          buttons[type].className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-750 hover:text-white flex items-center gap-1.5 transition-all";
        }
      });

      applyFilters();
    };

    window.filterSearch = (val) => {
      searchTerm = val.trim().toLowerCase();
      applyFilters();
    };

    window.showModal = (id) => {
      const item = elementaisData.find(x => x.id === id);
      if (!item) return;
      document.getElementById('modal-title').innerText = `${item.nome} (#${item.id})`;
      document.getElementById('modal-version').innerText = item.versao;
      document.getElementById('modal-version').className = `text-[11px] font-bold px-2.5 py-0.5 rounded-full uppercase ${item.badgeClass}`;
      document.getElementById('modal-desc').innerText = item.descricao;
      document.getElementById('info-modal').classList.remove('hidden');
    };

    window.closeModal = () => {
      document.getElementById('info-modal').classList.add('hidden');
    };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8 font-sans selection:bg-cyan-500 selection:text-black">
  <div class="max-w-7xl mx-auto">
    
    <!-- Top Header / Dashboard -->
    <header class="mb-6 p-6 rounded-2xl bg-slate-900/60 border border-slate-800 backdrop-blur-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-xs font-mono uppercase tracking-widest text-slate-400">Sincronização ao Vivo</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold font-gaming text-white tracking-wide">
          ESPÍRITOS ELEMENTAIS // <span class="text-cyan-400">FORTNITE</span>
        </h1>
        <p class="text-sm text-slate-400 mt-1">Checklist com Captura e Domínio de Coroa (👑) em tempo real.</p>
      </div>

      <!-- Barra de Progresso Global -->
      <div class="w-full md:w-72 bg-slate-950 p-4 rounded-xl border border-slate-800">
        <div class="flex justify-between items-center text-xs font-mono mb-2">
          <span class="text-slate-400">Coletados</span>
          <div class="flex items-center gap-2">
            <span id="crowned-counter" class="text-amber-400 font-bold text-[11px]">0 Dominados</span>
            <span class="text-slate-600">|</span>
            <span id="counter" class="text-emerald-400 font-bold">0 / 64</span>
          </div>
        </div>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
        </div>
        <div class="text-right text-[11px] font-mono text-slate-500 mt-1" id="progress-pct">0%</div>
      </div>
    </header>

    <!-- Barra de Filtros e Busca -->
    <div class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-900/40 p-3 rounded-xl border border-slate-800/80">
      
      <!-- Botões de Status (Todos / Obtidos / Dominados / Faltando) -->
      <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
        <button id="btn-all" onclick="setFilter('all')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500 text-slate-950 shadow-md flex items-center gap-1.5 transition-all">
          <span>Todos</span>
          <span id="count-all" class="bg-black/20 px-1.5 py-0.2 rounded text-[10px] font-mono">64</span>
        </button>

        <button id="btn-checked" onclick="setFilter('checked')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-750 hover:text-white flex items-center gap-1.5 transition-all">
          <span class="text-emerald-400">✓</span>
          <span>Obtidos</span>
          <span id="count-checked" class="bg-slate-950/60 text-emerald-400 px-1.5 py-0.2 rounded text-[10px] font-mono">0</span>
        </button>

        <button id="btn-crowned" onclick="setFilter('crowned')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-750 hover:text-white flex items-center gap-1.5 transition-all">
          <span>👑</span>
          <span>Dominados</span>
          <span id="count-crowned" class="bg-slate-950/60 text-amber-400 px-1.5 py-0.2 rounded text-[10px] font-mono">0</span>
        </button>

        <button id="btn-missing" onclick="setFilter('missing')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-750 hover:text-white flex items-center gap-1.5 transition-all">
          <span class="text-amber-400">⏳</span>
          <span>Faltando</span>
          <span id="count-missing" class="bg-slate-950/60 text-amber-400 px-1.5 py-0.2 rounded text-[10px] font-mono">64</span>
        </button>
      </div>

      <!-- Campo de Pesquisa -->
      <div class="relative w-full sm:w-64">
        <input 
          type="text" 
          placeholder="Buscar elemental ou #ID..." 
          oninput="filterSearch(this.value)"
          class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors"
        >
        <span class="absolute left-2.5 top-2 text-slate-500 text-xs">🔍</span>
      </div>
    </div>

    <!-- Mensagem de lista vazia após filtro -->
    <div id="empty-msg" class="hidden text-center py-16 text-slate-500 bg-slate-900/20 rounded-2xl border border-dashed border-slate-800">
      <p class="text-sm">Nenhum elemental corresponde aos filtros aplicados.</p>
    </div>

    <!-- Grid dos 64 Elementais -->
    <main id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3">
      <!-- Inserido dinamicamente pelo script -->
    </main>

  </div>

  <!-- Modal de Descrição e Habilidade -->
  <div id="info-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-slate-900 border border-slate-700 max-w-md w-full rounded-2xl p-6 shadow-2xl relative" onclick="event.stopPropagation()">
      <div class="flex items-start justify-between gap-3 mb-3">
        <div>
          <h3 id="modal-title" class="text-lg font-bold text-white font-gaming"></h3>
          <span id="modal-version"></span>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg font-mono leading-none">&times;</button>
      </div>
      <p class="text-xs text-slate-400 font-mono uppercase tracking-wider mb-2">Efeito & Habilidade:</p>
      <p id="modal-desc" class="text-sm text-slate-200 leading-relaxed bg-slate-950/60 p-3 rounded-lg border border-slate-800"></p>
      <div class="mt-5 text-right">
        <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 uppercase tracking-wider">Fechar</button>
      </div>
    </div>
  </div>
</body>
</html>
